server:
  port: 8081    # start a second instance with --server.port=8082

spring:
  application:
    name: orders            # configstream's collections: orders_config and orders_config_history
  data:
    mongodb:
      # The service's own MongoDB; configstream shares this connection. Set the CONFIGSTREAM_MONGO_URI
      # environment variable to use another MongoDB (e.g. Atlas), so passwords stay out of this file.
      uri: ${CONFIGSTREAM_MONGO_URI:mongodb://localhost:27017/?replicaSet=rs0&socketTimeoutMS=30000}
      database: orders

configstream:
  team: team-a
  internal:
    # Must match the admin server's default-service-secret. Local testing only: never reuse it.
    secret: local-dev-secret-123456
  admin:
    url: http://localhost:8090
